- date: November 10, 2025
  headline: |
    Congratulations to CWT United, a joint team from Tongji University, the Chinese University of Hong Kong (CUHK), and Wuhan University, on winning both the indoor and outdoor titles at **IMAV 2025**. The team won both the indoor and outdoor search-and-rescue titles at the International Micro Air Vehicle Competition (IMAV 2025) in Puebla, Mexico, and received an additional "Outstanding Performance" medal.

    恭喜由同济大学、香港中文大学与武汉大学组成的联合团队（CWT United）荣获 **IMAV 2025** 室内赛与室外赛“双料冠军”，并因室内任务的出色表现额外获得“Outstanding Performance”特别奖牌。

