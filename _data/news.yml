- date: October 23, 2026
  headline: |
    Congratulations! Chenxiao Wang's paper "ACAI-3D: An Adaptive Compact Acoustic-Inertial 3-D SLAM for Underwater Vehicles" has been accepted for publication in **IEEE Transactions on Industrial Electronics (IEEE TIE)**.

    恭喜王晨晓的论文“ACAI-3D: An Adaptive Compact Acoustic-Inertial 3-D SLAM for Underwater Vehicles”被 **IEEE Transactions on Industrial Electronics (IEEE TIE)** 接收！

- date: July 16, 2026
  headline: |
    Congratulations! Shuchen Zhou's paper "Underwater Trajectory Generation via Differential Flatness for an Unmanned Aerial-Aquatic Vehicle" has been accepted for presentation at **IEEE CDC 2026**.

    恭喜周书臣的论文“Underwater Trajectory Generation via Differential Flatness for an Unmanned Aerial-Aquatic Vehicle”被 **IEEE CDC 2026** 接收！

- date: July 10, 2026
  headline: |
    Congratulations! Xinkun Wang's paper "Efficient Thrust Vector Allocation for Tilt-Rotor Aerial-Aquatic Vehicle Using Null-Space Parameterized Optimization" has been accepted for presentation at **IEEE/RSJ IROS 2026**.

    恭喜王歆坤的论文“Efficient Thrust Vector Allocation for Tilt-Rotor Aerial-Aquatic Vehicle Using Null-Space Parameterized Optimization”被 **IEEE/RSJ IROS 2026** 接收！

