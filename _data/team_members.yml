- name: Ben M. Chen (陈本美)
  photo: BMChen.jpg
  info: Professor
  email: bmchen@cuhk.edu.hk
  websites:
    - label: Website (Department)
      url: https://www4.mae.cuhk.edu.hk/peoples/chen-benmei/
    - label: Website (Personal)
      url: http://www.mae.cuhk.edu.hk/~bmchen/
  short_bio: Ben M. Chen is a professor and Chairman of the Department of Mechanical and Automation Engineering at the Chinese University of Hong Kong (CUHK). Prior to joining CUHK in 2018, he was a Provost's Chair Professor in the Department of Electrical and Computer Engineering at the National University of Singapore (NUS), where he worked for 25 years. He is an IEEE Fellow and a Fellow of the Academy of Engineering, Singapore. He is also a part-time professor at Tongji University. His research interests include unmanned systems and their applications.

- name: Jie Chen (陈杰)
  photo: jie_chen.png
  info: Professor
  website: https://www.tongji.edu.cn/info/1136/21221.htm
  short_bio: Jie Chen is a professor and secretary of the CPC Committee of Harbin Institute of Technology. He is an academician of the Chinese Academy of Engineering, an IEEE Fellow, an IFAC Fellow, and an ACA Fellow. He serves as director of the State Key Laboratory of Autonomous Intelligent Systems, the Frontiers Science Center under the Ministry of Education, and the Shanghai Science Center for Autonomous Intelligent Systems. His research interests include control science and engineering, multi-objective optimization and control of complex systems, and multi-agent cooperative control. He previously served as vice president of Beijing Institute of Technology, president of Tongji University, and vice minister of the Ministry of Education of the PRC.

- name: Bin He (何斌)
  photo: bin_he.jpg
  info: Professor
  email: hebin@tongji.edu.cn
  website: https://robot.tongji.edu.cn/info/1256/2083.htm
  short_bio: Bin He is a professor at Tongji University, affiliated with the Shanghai Research Institute for Intelligent Autonomous Systems and the College of Electronic and Information Engineering. He serves as executive director of the Shanghai Science Center for Autonomous Intelligent Systems and deputy director of the State Key Laboratory of Autonomous Intelligent Systems. His research interests include intelligent robotics, intelligent perception, digital twins, and physical AI.

- name: Yulong Ding (丁玉隆)
  photo: yulong_ding.png
  info: Assistant Professor
  email: dingyulong@tongji.edu.cn
  website: https://robot.tongji.edu.cn/info/1256/2269.htm
  short_bio: Yulong Ding is an assistant professor at Tongji University, affiliated with the Shanghai Research Institute for Intelligent Autonomous Systems and the Department of Control Science and Engineering. He received his Ph.D. degree in automation from Beijing Institute of Technology in 2020. His research interests include human-machine collaboration and cooperative task planning for aerial and ground robots.

- name: Yu Herng Tan (陈宇珩)
  photo: yuheng_chen.jpg
  info: Assistant Professor
  email: yhtan@tongji.edu.cn
  website: https://robot.tongji.edu.cn/info/1256/2808.htm
  short_bio: Yu Herng Tan is an assistant professor with the Shanghai Research Institute for Intelligent Autonomous Systems, Tongji University. She received her M.Eng. degree in aerospace engineering from Imperial College London in 2016 and her Ph.D. degree in electrical and computer engineering from the National University of Singapore (NUS) in 2020 under the supervision of Prof. Ben M. Chen. She completed her postdoctoral research at Tsinghua University from 2022 to 2025. Her research interests include cross-medium unmanned vehicles and intelligent UAV systems.

- name: Biao Wang (王彪)
  photo: biao_wang_v1.png
  info: Associate Professor
  email: wangbiao@nuaa.edu.cn
  website: https://cae.nuaa.edu.cn/2018/0906/c13665a132102/page.htm
  short_bio: Biao Wang is an associate professor with the College of Automation Engineering, Nanjing University of Aeronautics and Astronautics (NUAA). He received his Ph.D. in navigation, guidance, and control from NUAA in 2004. He was a visiting scholar at the Chinese University of Hong Kong (CUHK) in 2001 and at the National University of Singapore (NUS) from 2009 to 2012. His research interests include unmanned aerial vehicle systems, flight control, and computer vision.

- name: Lihua Dou (窦丽华)
  photo: lihua_dou_v1.jpg
  info: Professor
  email: doulihua@bit.edu.cn
  website: https://ac.bit.edu.cn/szdw/jsml/mssbyznxtyjs1/91a4638cf2634ad08798c44bc59db58c.htm
  short_bio: Lihua Dou is a professor with the School of Automation, Beijing Institute of Technology. She is a part-time professor at Tongji University. Her research interests include nonlinear control, image processing and target recognition in complex visual scenes, network control and security, command and control, and expert systems.

